---
- name: Install and configure Nginx
  hosts: client
  become: true
  gather_facts: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Enable Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true

    - name: Start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started

    - name: Verify Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Check Nginx service
      ansible.builtin.systemd:
        name: nginx
      register: nginx_status
      changed_when: false

    - name: Display Nginx status
      ansible.builtin.debug:
        msg: "Nginx status: {{ nginx_status.status.ActiveState }}"
