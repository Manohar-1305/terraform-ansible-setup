---
- name: Change root password and install QEMU
  hosts: client
  become: true
  gather_facts: yes

  vars:
    root_password: "ChangeMe@123"

  tasks:
    - name: Get Ubuntu version
      ansible.builtin.shell: |
        . /etc/os-release
        echo "$VERSION_ID"
      register: ubuntu_version
      changed_when: false

    - name: Display Ubuntu version
      ansible.builtin.debug:
        msg: "Ubuntu version: {{ ubuntu_version.stdout }}"

    - name: Change root password
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"

    - name: Enable Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        state: present

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install QEMU packages
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - qemu-system
          - qemu-utils
          - qemu-guest-agent
          - libvirt-daemon-system
          - libvirt-clients
        state: present

    - name: Enable QEMU Guest Agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: yes
        daemon_reload: yes
      failed_when: false

    - name: Check QEMU Guest Agent status
      ansible.builtin.command:
        cmd: systemctl is-enabled qemu-guest-agent
      register: qemu_agent_status
      changed_when: false
      failed_when: false

    - name: Display QEMU Guest Agent status
      ansible.builtin.debug:
        msg: "QEMU Guest Agent status: {{ qemu_agent_status.stdout }}"
